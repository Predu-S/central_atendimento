name: Frontend React
on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Checkout validated backend contract
        uses: actions/checkout@v4
        with:
          ref: 8519e4a3038cced51d332921e661ae0e16604178
          path: _integration
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Start .NET API
        run: |
          cd _integration/backend
          dotnet build src/Api --configuration Release
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5000 dotnet src/Api/bin/Release/net8.0/Api.dll --contentRoot "$PWD/src/Api" > "$GITHUB_WORKSPACE/backend-integration.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:5000/swagger/v1/swagger.json > "$GITHUB_WORKSPACE/swagger-contract.json"; then exit 0; fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/backend-integration.log"
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000
      - name: Export preview for visual review
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, base64
          p=pathlib.Path('frontend/test-results/dashboard-desktop.png')
          if p.exists(): print('DASHBOARD_PREVIEW '+base64.b64encode(p.read_bytes()).decode())
          for name in ['equipe-dark', 'clientes-mobile']:
              p=pathlib.Path('frontend/test-results/'+name+'.jpg')
              if p.exists(): print('VISUAL_PREVIEW '+name+' '+base64.b64encode(p.read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-validation
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/dist
            swagger-contract.json
            backend-integration.log
